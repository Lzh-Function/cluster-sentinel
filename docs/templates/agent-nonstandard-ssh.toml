# Cluster Sentinel、agent（SSHが22以外の場合）
#
# 配置先: /etc/sentinel/config.toml
#
# 通常はこのファイルは不要です。agentは /etc/ssh/sshd_configの
# `Port`および`ListenAddress host:port`を読んで自動検出します。
#
# 明示が必要なのは次の場合だけです。
#   * sshd_configが読めない（権限、または別パス）
#   * ポートがsshd_config以外の場所で設定されている
#     （systemd socket activation、includeされたファイル等）
#
# 優先順位:  [agent] ssh_port  >  sshd_configのPort  >  既定値22
#
# 実際のSSHポートを自動検出できず、明示的な設定もない場合は、
# probeが22番へ接続し、正常なSSHサービスを障害として報告します。

config_version = 1
environment = "CHANGE-ME-environment"

[agent]
controller_address = "CHANGE-ME-controller-host:7443"
spool_path = "/var/lib/sentinel/spool.db"
listen = "0.0.0.0:7444"

# ここ
ssh_port = 2222

roles = ["compute"]

[capabilities]
"observer.peer" = "force"
