# Cluster Sentinel、agent
#
# 配置先: /etc/sentinel/config.toml（監視対象の各ホスト）
# 検証:   sudo -u sentinel sentinel config check
#
# 全agentホストで同じ内容にできます。
# capabilityはagentが自動検出するため、列挙する必要はありません。

config_version = 1

# controllerのenvironmentと一致させること。
environment = "CHANGE-ME-environment"

[agent]
controller_address = "CHANGE-ME-controller-host:7443"
spool_path = "/var/lib/sentinel/spool.db"

# health endpoint。peerがここを見て
# agentのみの停止とホスト全体の停止を区別します。
# 変更した場合、agentが自分でcontrollerに報告するため
# controller側への追記は不要です。
listen = "0.0.0.0:7444"

# ---------------------------------------------------------------------------
# peerがこのホストに到達するアドレス
#
# 未指定なら自動検出しますが、「どのNICでクラスタ内通信をしているか」は
# クラスタ内の構成によって決まるため、ホストの情報だけでは判別できません。
# VLANやbridge、複数fabricがある環境では必ず指定してください。
#
# `sentinel doctor`で、報告されるアドレスと候補を確認できます。
# ---------------------------------------------------------------------------
# interface = "vlan20"          # NIC名（全ノードで同じ1行が使える）
# address   = "192.0.2.20"    # 直接指定（NAT越しなど）

# SSHが22以外で、かつ /etc/ssh/sshd_configから読めない場合のみ指定。
# 通常はagentがsshd_configから自動検出します。
# ssh_port = 2222

# UI上のグループ分けと既定値の提示にのみ使われます。
# probeを有効化することはありません。
roles = ["compute"]


# ===========================================================================
# このホストをpeer observerにする場合
#
# observerは互いに異なる障害ドメインから選んでください。
# 同じストレージを使う3台は、そのストレージの障害で同時に影響を受けるためです。
#
# observerが1台以下のentityについては、
# 到達性の診断が一切行われません。
# ===========================================================================
[capabilities]
"observer.peer" = "force"


# ===========================================================================
# TLS（agent側）
#
# ここに1つでも設定があると、controller_addressの "ホスト:ポート" は
# https:// として解釈されます。
#
# 手順はdocs/DEPLOYMENT.md §9.6を参照。
# ===========================================================================
# [tls]
# ca = "/etc/sentinel/tls/ca.crt"
#
# mutual TLSの場合。証明書はホストごとに発行してください。
# client_cert = "/etc/sentinel/tls/agent.crt"
# client_key  = "/etc/sentinel/tls/agent.key"
#
# IPで接続し、証明書は名前しか持たない場合。
# server_name = "CHANGE-ME-controller-host"
#
# PKIがまだ無い場合の暫定措置。TLSで接続先の正当性を確認できなくなります。
# insecure_skip_verify = true
