# Cluster Sentinel、controller
#
# 配置先: /etc/sentinel/config.toml（controllerを動かすホスト）
# 検証:   sudo -u sentinel sentinel config check
#
# CHANGE-MEを実際の値へ置き換えてください。

config_version = 1

# 全ホストで一致させること。agent側のenvironmentと一致しないと登録されません。
environment = "CHANGE-ME-environment"

[controller]
listen = "0.0.0.0:7443"
inventory_interval = "5m"

# controller自身も観測点として動作します。
# firewallなどでcontrollerからの通信経路が制限される場合のみfalseにしてください。
observe = true

[database]
path = "/var/lib/sentinel/sentinel.db"

[peer_monitoring]
# 1 entityあたりのobserver数。
# 0にすると到達性の診断（HOST_UNREACHABLE / PATH_SPECIFIC_NETWORK_FAILURE）が
# 一切行われなくなります。
degree = 3

[discovery.slurm]
enabled = true
# scontrolがPATHにない場合のみ指定
# scontrol_path = "/opt/slurm/bin/scontrol"

[notification]
# 導入初期は "critical" から始めるのも有効です。
min_severity = "warning"

# 同一宛先への送信間隔の下限です。間隔を空けて順に送るため、
# 一度に多数のincidentが開いても通知は捨てられず、順に遅れて届きます。
# 既定値はSlackのincoming webhookの公称上限に合わせてあります。
min_interval = "1s"

# 宛先。複数指定でき、重複排除は宛先ごとに行われます。
# formatは "generic"（汎用JSON）か "slack"（Block Kit; 色・太字つき）。
# [[notification.webhooks]]
# name   = "ntfy"
# url    = "https://ntfy.example.org/CHANGE-ME"
# format = "generic"


# ===========================================================================
# Scheduler entity
#
# SlurmのClusterNameに合わせておくと分かりやすくなります。
# 省略した場合の既定値は "slurm" です。
# ===========================================================================
[[entities]]
type = "scheduler"
name = "CHANGE-ME-cluster-name"


# ===========================================================================
# Slurmの外にあるホスト
#
# Slurm自動検出では見つからないため、ここで宣言します。
# 後からagentを入れる予定でも、先に書いて構いません（mergeされます）。
# ===========================================================================
[[entities]]
type = "host"
name = "CHANGE-ME-fileserver-1"
addresses = ["CHANGE-ME-10.0.0.10"]
capabilities = ["storage.nfs.server", "observer.peer"]
labels = { role = "fileserver" }
# SSHが22以外の場合のみ。agentがいないホストでは自動検出できません。
# ports = { ssh = 2222 }

[[entities]]
type = "host"
name = "CHANGE-ME-fileserver-2"
addresses = ["CHANGE-ME-10.0.0.11"]
capabilities = ["storage.nfs.server", "observer.peer"]
labels = { role = "fileserver" }


# ===========================================================================
# Storage entity
#
# ファイルサーバーそのものとは別の概念として扱います。
# 「ファイルサーバーは稼働しているがexportサービスだけ停止した」を
# 表現するために必要です。
# ===========================================================================
[[entities]]
type = "storage"
name = "CHANGE-ME-storage-1"

[[entities]]
type = "storage"
name = "CHANGE-ME-storage-2"


# ===========================================================================
# 依存関係。fromがtoに依存します。
#
# NFSについては、以下を手で書く必要は通常ありません。
# agentが報告するマウント表から、ファイルサーバーのホストentity・ストレージentity・
# provides・uses_storageがすべて自動で導出されます
# （[discovery.nfs] enabled = falseで停止）。
# 導出結果は`sentinel dependency list`で確認できます。
# 以下は「導出できないものを手で足す」ための書式例です
# NFS以外の共有ストレージ、どのノードもマウントしていないファイルサーバー、
# マウントがIPで書かれていてそのIPを持つホストをSentinelが知らない場合。
#
# 依存関係が無いと、複数ノードが同時にストレージ障害を起こしたとき、
# SHARED_STORAGE_FAILURE（原因 = ファイルサーバー）ではなく
# 個別のNFS_CLIENT_FAILUREとして報告されます。
#
# 宣言していないentityを参照してもwarningで済みます
# （Slurm自動検出やagent registrationから到着し得るため）。
#
# したがって`sentinel config check`は、計算ノードへの依存について
#
#   warning: dependencies[N].from: host/... is not declared here;
#            it must come from discovery or registration
#
# を出します。これは正常です。計算ノードはSlurm自動検出から
# 到着するため、ここで宣言する必要はありません。
# ===========================================================================

# ストレージはファイルサーバーが提供する
[[dependencies]]
from = "storage/CHANGE-ME-storage-1"
to   = "host/CHANGE-ME-fileserver-1"
type = "provides"

[[dependencies]]
from = "storage/CHANGE-ME-storage-2"
to   = "host/CHANGE-ME-fileserver-2"
type = "provides"

# storage-1を使うノード（実構成に合わせて増やす）
[[dependencies]]
from = "host/CHANGE-ME-compute-1"
to   = "storage/CHANGE-ME-storage-1"
type = "uses_storage"

[[dependencies]]
from = "host/CHANGE-ME-compute-2"
to   = "storage/CHANGE-ME-storage-1"
type = "uses_storage"

# storage-2を使うノード
[[dependencies]]
from = "host/CHANGE-ME-compute-3"
to   = "storage/CHANGE-ME-storage-2"
type = "uses_storage"


# ===========================================================================
# capabilityの上書き（必要な場合のみ）
#
# 優先順位:  disable > force > runtime自動検出 > enable / 役割hint
#
# 想定と違う場合は、まず対象ホストで`sentinel doctor`を実行し、
# 判定理由を確認してください。
# ===========================================================================
# [capabilities]
# "storage.nfs.server" = "force"
# "storage.smart"      = "disable"


# ===========================================================================
# 記録の保持期間
#
# 観測データは継続して増えるため、削除しなければディスク容量を使い切ります。
# 実測でホスト1台あたり1日約170 MB。
#
# 既定値のままでpruneは有効です。このセクションを書くのは、
# 既定と違う期間にしたい場合だけです。
# ===========================================================================
# [retention]
# enabled            = true
# interval           = "1h"
# observations       = "14d"    # 容量の大半。"never" も指定可
# keep_per_entity    = 64       # 期間に関わらずentityごとに残す件数
# transitions        = "90d"
# resolved_incidents = "180d"   # openなincidentは年齢に関わらず消えません
# diagnoses          = "30d"


# ===========================================================================
# TLS（controller側）
#
# credentialはbearer tokenです。平文で運用すると、
# wireを読める者が全agentになりすませます。
#
# 証明書は既存のPKIで発行してください。Sentinelは生成しません。
# 手順はdocs/DEPLOYMENT.md §9.6を参照。
# ===========================================================================
# [tls]
# cert = "/etc/sentinel/tls/controller.crt"
# key  = "/etc/sentinel/tls/controller.key"
#
# 以下を書くとクライアント証明書が「必須」になります（任意にはなりません）。
# tokenが漏れても耐えられる構成はこれだけです。
# client_ca = "/etc/sentinel/tls/ca.crt"
