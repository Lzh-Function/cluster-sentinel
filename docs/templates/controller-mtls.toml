# Cluster Sentinel、controller（mutual TLS）
#
# 配置先: /etc/sentinel/config.toml
# 検証:   sudo -u sentinel sentinel config check
#
# controller.tomlからTLS部分だけを取り出した最小構成です。
# entity / dependencyの宣言はcontroller.tomlを参照してください。
#
# mutual TLSは、cluster credentialが漏洩してもtokenに加えてクライアント証明書を要求します。
# クライアント証明書を持たない相手は、tokenを使った認証に進めません。

config_version = 1
environment = "CHANGE-ME-environment"

[controller]
listen = "0.0.0.0:7443"

[database]
path = "/var/lib/sentinel/sentinel.db"

[discovery.slurm]
enabled = true

# ===========================================================================
# TLS
#
# 証明書は既存のPKIで発行してください。Sentinelは生成しません。
#
#   cert:      controllerの証明書。SANにagentが接続に使う
#              名前またはアドレスを必ず含めること
#   key:       その秘密鍵。0600でsentinelユーザーのみ読めるようにする
#   client_ca: これを書くとクライアント証明書は「必須」になります。
#              提示を任意にすると、証明書を持たない相手も接続できます
#
# 証明書や秘密鍵が読めない場合、controllerは起動に失敗します。
# 暗号化が無効のまま運用されるのを防ぐためです。
# ===========================================================================
[tls]
cert      = "/etc/sentinel/tls/controller.crt"
key       = "/etc/sentinel/tls/controller.key"
client_ca = "/etc/sentinel/tls/ca.crt"

# ===========================================================================
# 保持期間（既定と異なる値にする場合のみ）
# ===========================================================================
[retention]
observations       = "14d"
resolved_incidents = "180d"
