# Making slurmd start inside a container took some finding, so the reasoning is
# recorded here rather than left as folklore.
#
# Slurm 23.11's cgroup/v2 plugin creates its slurmstepd scope through systemd
# over dbus. A container has neither, so autodetect fails with a confusing
# "scope entered in a failed state" error and slurmd never registers -- leaving
# every node in UNKNOWN+NOT_RESPONDING.
#
#   * `CgroupPlugin=disabled` would be the obvious answer, but it does not
#     exist in 23.11 (it arrives later); naming it makes Slurm hunt for a
#     plugin called "disabled" and fail differently.
#   * `IgnoreSystemd=yes` removes the dbus dependency.
#   * cgroup/v1 is then chosen explicitly, because it needs only a writable
#     directory layout, which the entrypoint creates on a tmpfs.
#
# None of this affects what the testbed tests. No jobs are run here, and the
# scenarios are about daemons, services and network paths, not about resource
# containment.

CgroupPlugin=cgroup/v1
IgnoreSystemd=yes
